---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bjw-s
  namespace: n8n
spec:
  interval: 24h
  url: https://bjw-s-labs.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: n8n
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "3.*"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: n8n
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: n8nio/n8n
              tag: latest
            env:
              TZ: "Europe/London"
              GENERIC_TIMEZONE: "Europe/London"
              N8N_HOST: "n8n.liberispat.com"
              N8N_PROTOCOL: "https"
              WEBHOOK_URL: "https://n8n.liberispat.com/"
              N8N_EDITOR_BASE_URL: "https://n8n.liberispat.com/"
            probes:
              liveness:
                enabled: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 5678
                  initialDelaySeconds: 60
                  periodSeconds: 30
              readiness:
                enabled: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 5678
                  initialDelaySeconds: 30
                  periodSeconds: 10
              startup:
                enabled: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 5678
                  failureThreshold: 30
                  periodSeconds: 10

    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: nixos

    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 5678

    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: zfs-nfs
        globalMounts:
          - path: /home/node/.n8n
