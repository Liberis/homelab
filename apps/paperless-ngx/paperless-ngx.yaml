---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bjw-s
  namespace: paperless-ngx
spec:
  interval: 24h
  url: https://bjw-s-labs.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx
  namespace: paperless-ngx
spec:
  interval: 30m
  timeout: 15m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: app-template
      version: "3.*"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: paperless-ngx
  values:
    controllers:
      # Redis for caching/task queue
      redis:
        containers:
          main:
            image:
              repository: redis
              tag: 7-alpine
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi

      # Main Paperless-ngx application
      main:
        containers:
          main:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: latest
            env:
              PAPERLESS_URL: https://paperless.liberispat.com
              PAPERLESS_REDIS: redis://paperless-ngx-redis:6379
              PAPERLESS_DBENGINE: sqlite
              PAPERLESS_OCR_LANGUAGE: eng
              PAPERLESS_TIME_ZONE: UTC
              # OIDC Configuration (Authentik)
              PAPERLESS_APPS: "allauth.socialaccount.providers.openid_connect"
              PAPERLESS_SOCIALACCOUNT_PROVIDERS: |
                {
                  "openid_connect": {
                    "APPS": [{
                      "provider_id": "authentik",
                      "name": "Authentik",
                      "client_id": "paperless",
                      "secret": "${PAPERLESS_OIDC_CLIENT_SECRET}",
                      "settings": {
                        "server_url": "https://auth.liberispat.com/application/o/paperless/"
                      }
                    }],
                    "OAUTH_PKCE_ENABLED": "True"
                  }
                }
            envFrom:
              - secretRef:
                  name: paperless-credentials
              - secretRef:
                  name: paperless-oidc-credentials
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 2000m
                memory: 2Gi

    service:
      main:
        controller: main
        ports:
          http:
            port: 8000
      redis:
        controller: redis
        ports:
          redis:
            port: 6379

    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: zfs-nfs
        globalMounts:
          - path: /usr/src/paperless/data
      media:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 50Gi
        storageClass: zfs-nfs
        globalMounts:
          - path: /usr/src/paperless/media
      consume:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: zfs-nfs
        globalMounts:
          - path: /usr/src/paperless/consume

    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: jarvis
