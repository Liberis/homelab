---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-credentials
  namespace: paperless-ngx
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: paperless-credentials
    creationPolicy: Owner
  data:
    - secretKey: PAPERLESS_ADMIN_USER
      remoteRef:
        key: secret/paperless
        property: admin_user
    - secretKey: PAPERLESS_ADMIN_PASSWORD
      remoteRef:
        key: secret/paperless
        property: admin_password
    - secretKey: PAPERLESS_SECRET_KEY
      remoteRef:
        key: secret/paperless
        property: secret_key
---
# OIDC credentials for Authentik integration
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-oidc-credentials
  namespace: paperless-ngx
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: paperless-oidc-credentials
    creationPolicy: Owner
  data:
    - secretKey: PAPERLESS_OIDC_CLIENT_SECRET
      remoteRef:
        key: secret/authentik
        property: paperless_client_secret
