---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bjw-s
  namespace: exo
spec:
  interval: 24h
  url: https://bjw-s-labs.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: exo
  namespace: exo
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: app-template
      version: "3.*"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: exo
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: exolabs/exo
              tag: latest
            args:
              - --disable-tui
              - --chatgpt-api-port
              - "8000"
            env:
              TZ: "Europe/London"
            probes:
              liveness:
                enabled: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  initialDelaySeconds: 60
                  periodSeconds: 30
              readiness:
                enabled: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  initialDelaySeconds: 30
                  periodSeconds: 10
              startup:
                enabled: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              limits:
                nvidia.com/gpu-all: 1

    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: nixos

    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 8000

    persistence:
      cache:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 50Gi
        storageClass: zfs-nfs
        globalMounts:
          - path: /root/.cache/huggingface
