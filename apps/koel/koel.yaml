---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bjw-s
  namespace: koel
spec:
  interval: 24h
  url: https://bjw-s-labs.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: koel
  namespace: koel
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: app-template
      version: "3.*"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: koel
  values:
    controllers:
      main:
        initContainers:
          init-storage:
            image:
              repository: phanan/koel
              tag: "8.2.0"
            command:
              - sh
              - -c
              - |
                cp -a /var/www/html/storage/. /storage/
                chown -R www-data:www-data /storage
                chmod -R 775 /storage
        containers:
          main:
            image:
              repository: phanan/koel
              tag: "8.2.0"
            env:
              TZ: "Europe/London"
              DB_CONNECTION: sqlite
              MEDIA_PATH: /music
              FORCE_HTTPS: "true"
            probes:
              liveness:
                enabled: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 30
                  periodSeconds: 30
              readiness:
                enabled: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 10
              startup:
                enabled: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 512Mi

    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: akasha

    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 80

    persistence:
      env:
        enabled: true
        type: secret
        name: koel-env
        advancedMounts:
          main:
            main:
              - path: /var/www/html/.env
                subPath: .env
            init-storage:
              - path: /var/www/html/.env
                subPath: .env
      storage:
        enabled: true
        type: emptyDir
        advancedMounts:
          main:
            init-storage:
              - path: /storage
            main:
              - path: /var/www/html/storage
      data:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 2Gi
        storageClass: zfs-nfs
        advancedMounts:
          main:
            main:
              - path: /data
            init-storage:
              - path: /data
      music:
        enabled: true
        type: hostPath
        hostPath: /mnt/media
        hostPathType: Directory
        globalMounts:
          - path: /music
      covers:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: zfs-nfs
        globalMounts:
          - path: /var/www/html/public/img/covers

