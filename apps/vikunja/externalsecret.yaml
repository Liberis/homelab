---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja-credentials
  namespace: vikunja
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: vikunja-credentials
    creationPolicy: Owner
  data:
    - secretKey: db_username
      remoteRef:
        key: secret/vikunja
        property: db_username
    - secretKey: db_password
      remoteRef:
        key: secret/vikunja
        property: db_password
    - secretKey: jwt_secret
      remoteRef:
        key: secret/vikunja
        property: jwt_secret
    - secretKey: typesense_api_key
      remoteRef:
        key: secret/vikunja
        property: typesense_api_key
---
# CNPG requires username and password keys for bootstrap secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja-postgres-credentials
  namespace: vikunja
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: vikunja-postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: secret/vikunja
        property: db_username
    - secretKey: password
      remoteRef:
        key: secret/vikunja
        property: db_password
---
# OIDC credentials for Authentik integration
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja-oidc-credentials
  namespace: vikunja
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: vikunja-oidc-credentials
    creationPolicy: Owner
  data:
    - secretKey: VIKUNJA_AUTH_OPENID_CLIENTSECRET
      remoteRef:
        key: secret/authentik
        property: vikunja_client_secret
