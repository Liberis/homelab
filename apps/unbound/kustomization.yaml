---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: unbound
resources:
  - namespace.yaml
  - unbound.yaml
  - servicemonitor.yaml
configMapGenerator:
  - name: unbound-dashboard
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
    files:
      - dashboards/unbound.json
