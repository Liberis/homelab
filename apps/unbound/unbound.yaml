---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bjw-s
  namespace: unbound
spec:
  interval: 24h
  url: https://bjw-s-labs.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unbound
  namespace: unbound
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: app-template
      version: "3.*"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: unbound
  values:
    controllers:
      main:
        initContainers:
          gen-certs:
            image:
              repository: alpine/openssl
              tag: latest
            command:
              - sh
              - -c
              - |
                openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
                  -keyout /certs/unbound_control.key -out /certs/unbound_control.pem \
                  -days 3650 -nodes -subj '/CN=unbound'
                cp /certs/unbound_control.pem /certs/unbound_server.pem
                cp /certs/unbound_control.key /certs/unbound_server.key
        containers:
          main:
            image:
              repository: klutchell/unbound
              tag: latest
            env:
              TZ: "Europe/London"
            probes:
              liveness:
                enabled: true
                spec:
                  exec:
                    command:
                      - drill
                      - "@127.0.0.1"
                      - -p
                      - "53"
                      - cloudflare.com
                  initialDelaySeconds: 30
                  periodSeconds: 30
              readiness:
                enabled: true
                spec:
                  exec:
                    command:
                      - drill
                      - "@127.0.0.1"
                      - -p
                      - "53"
                      - cloudflare.com
                  initialDelaySeconds: 10
                  periodSeconds: 10
              startup:
                enabled: true
                spec:
                  exec:
                    command:
                      - drill
                      - "@127.0.0.1"
                      - -p
                      - "53"
                      - cloudflare.com
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
          exporter:
            image:
              repository: cyb3rjak3/unbound-exporter
              tag: 0.5.0
            args:
              - --unbound.host=tcp://127.0.0.1:8953
            probes:
              liveness:
                enabled: true
                spec:
                  httpGet:
                    path: /metrics
                    port: 9167
                  initialDelaySeconds: 30
                  periodSeconds: 30
              readiness:
                enabled: true
                spec:
                  httpGet:
                    path: /metrics
                    port: 9167
                  initialDelaySeconds: 10
                  periodSeconds: 10
              startup:
                enabled: true
                spec:
                  httpGet:
                    path: /metrics
                    port: 9167
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 64Mi

    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: mainframe

    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          dns-tcp:
            port: 53
            protocol: TCP
          dns-udp:
            port: 53
            protocol: UDP
          metrics:
            port: 9167
            protocol: TCP

    persistence:
      custom-config:
        enabled: true
        type: configMap
        name: unbound-custom-config
        advancedMounts:
          main:
            main:
              - path: /etc/unbound/custom.conf.d/stats.conf
                subPath: stats.conf
      certs:
        enabled: true
        type: emptyDir
        advancedMounts:
          main:
            gen-certs:
              - path: /certs
            exporter:
              - path: /etc/unbound

    configMaps:
      custom-config:
        enabled: true
        data:
          stats.conf: |
            server:
                extended-statistics: yes
                statistics-cumulative: no
            remote-control:
                control-enable: yes
                control-interface: 127.0.0.1
                control-port: 8953
                control-use-cert: no
