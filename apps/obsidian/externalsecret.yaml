---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-credentials
  namespace: obsidian
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: obsidian-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: secret/obsidian
        property: username
    - secretKey: password
      remoteRef:
        key: secret/obsidian
        property: password
