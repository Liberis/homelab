---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bjw-s
  namespace: obsidian
spec:
  interval: 24h
  url: https://bjw-s-labs.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: obsidian
  namespace: obsidian
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: app-template
      version: "3.*"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: obsidian
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: couchdb
              tag: latest
            env:
              TZ: "Europe/London"
              COUCHDB_USER:
                valueFrom:
                  secretKeyRef:
                    name: obsidian-credentials
                    key: username
              COUCHDB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: obsidian-credentials
                    key: password
            probes:
              liveness:
                enabled: true
                spec:
                  httpGet:
                    path: /_up
                    port: 5984
                  initialDelaySeconds: 30
                  periodSeconds: 30
              readiness:
                enabled: true
                spec:
                  httpGet:
                    path: /_up
                    port: 5984
                  initialDelaySeconds: 10
                  periodSeconds: 10
              startup:
                enabled: true
                spec:
                  httpGet:
                    path: /_up
                    port: 5984
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
            securityContext:
              runAsUser: 5984
              runAsGroup: 5984

    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: jarvis

    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 5984

    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: zfs-nfs
        globalMounts:
          - path: /opt/couchdb/data
      config:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: zfs-nfs
        globalMounts:
          - path: /opt/couchdb/etc/local.d
