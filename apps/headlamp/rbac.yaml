---
# FIX: Pre-created ServiceAccount with explicit ClusterRoleBinding
# Headlamp chart creates SA without sufficient permissions, resulting in
# "forbidden" errors when trying to list cluster-wide resources.
# Using cluster-admin for homelab convenience - production should use
# a more restrictive custom ClusterRole with read-only access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
