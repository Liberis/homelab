---
# Headlamp OIDC credentials for Authentik integration
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc-credentials
  namespace: headlamp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: headlamp-oidc-credentials
    creationPolicy: Owner
  data:
    - secretKey: HEADLAMP_OIDC_CLIENT_SECRET
      remoteRef:
        key: secret/authentik
        property: headlamp_client_secret
