---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bjw-s
  namespace: bazarr
spec:
  interval: 24h
  url: https://bjw-s-labs.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bazarr
  namespace: bazarr
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: app-template
      version: "3.*"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: bazarr
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: lscr.io/linuxserver/bazarr
              tag: latest
            env:
              TZ: "Europe/London"
              PUID: "1000"
              PGID: "1000"
            probes:
              liveness:
                enabled: true
                spec:
                  httpGet:
                    path: /
                    port: 6767
              readiness:
                enabled: true
                spec:
                  httpGet:
                    path: /
                    port: 6767
              startup:
                enabled: true
                spec:
                  httpGet:
                    path: /
                    port: 6767
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi

    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: jarvis

    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 6767

    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: zfs-nfs
        globalMounts:
          - path: /config
      media:
        enabled: true
        type: hostPath
        hostPath: /mnt/media
        globalMounts:
          - path: /media
