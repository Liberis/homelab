---
# PostgreSQL credentials for CNPG cluster bootstrap
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-postgres-credentials
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: authentik-postgres-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: secret/authentik
        property: db_username
    - secretKey: password
      remoteRef:
        key: secret/authentik
        property: db_password
---
# Authentik application secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: authentik-secrets
    creationPolicy: Owner
  data:
    # Django secret key for Authentik
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: secret/authentik
        property: secret_key
    # PostgreSQL connection
    - secretKey: AUTHENTIK_POSTGRESQL__PASSWORD
      remoteRef:
        key: secret/authentik
        property: db_password
    # Bootstrap admin password
    - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      remoteRef:
        key: secret/authentik
        property: admin_password
    # Bootstrap admin token (for API access)
    - secretKey: AUTHENTIK_BOOTSTRAP_TOKEN
      remoteRef:
        key: secret/authentik
        property: admin_token
    # OIDC Client Secrets for blueprints
    - secretKey: GRAFANA_CLIENT_SECRET
      remoteRef:
        key: secret/authentik
        property: grafana_client_secret
    - secretKey: IMMICH_CLIENT_SECRET
      remoteRef:
        key: secret/authentik
        property: immich_client_secret
    - secretKey: GITLAB_CLIENT_SECRET
      remoteRef:
        key: secret/authentik
        property: gitlab_client_secret
    - secretKey: MEALIE_CLIENT_SECRET
      remoteRef:
        key: secret/authentik
        property: mealie_client_secret
    - secretKey: VIKUNJA_CLIENT_SECRET
      remoteRef:
        key: secret/authentik
        property: vikunja_client_secret
    - secretKey: PAPERLESS_CLIENT_SECRET
      remoteRef:
        key: secret/authentik
        property: paperless_client_secret
