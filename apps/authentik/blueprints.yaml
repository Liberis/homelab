---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  # Kubernetes Service Connection for Outpost
  service-connection.yaml: |
    version: 1
    metadata:
      name: Kubernetes Service Connection
    entries:
      - model: authentik_outposts.kubernetesserviceconnection
        id: local-k8s-connection
        identifiers:
          name: Local Kubernetes Cluster
        attrs:
          name: Local Kubernetes Cluster
          local: true
          verify_ssl: true

  # Grafana - OIDC Provider
  grafana.yaml: |
    version: 1
    metadata:
      name: Grafana
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: grafana-provider
        identifiers:
          name: Grafana
        attrs:
          name: Grafana
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: grafana
          client_secret: !Env [GRAFANA_CLIENT_SECRET, grafana-client-secret-change-me]
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.liberispat.com/login/generic_oauth
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          access_code_validity: minutes=1
          access_token_validity: minutes=5
          refresh_token_validity: days=30
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          sub_mode: hashed_user_id
      - model: authentik_core.application
        id: grafana-app
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          slug: grafana
          provider: !KeyOf grafana-provider
          meta_launch_url: https://grafana.liberispat.com
          policy_engine_mode: any
          open_in_new_tab: true

  # Immich - OIDC Provider
  immich.yaml: |
    version: 1
    metadata:
