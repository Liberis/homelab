---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qui
  namespace: qbittorrent
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - qui.liberispat.com
      secretName: liberispat-wildcard-tls
  rules:
    - host: qui.liberispat.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbittorrent-main
                port:
                  number: 7476
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent
  namespace: qbittorrent
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - qbit.liberispat.com
      secretName: liberispat-wildcard-tls
  rules:
    - host: qbit.liberispat.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbittorrent-main
                port:
                  number: 8080
