---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: djjudas21
spec:
  interval: 24h
  url: https://djjudas21.github.io/charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: navidrome
  namespace: navidrome
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: navidrome
      version: "6.7.6"
      sourceRef:
        kind: HelmRepository
        name: djjudas21
        namespace: navidrome
  values:
    env:
      ND_MUSICFOLDER: "/music"
      ND_LOGLEVEL: "info"
      TZ: "Europe/London"

    persistence:
      config:
        enabled: true
        size: 2Gi
        accessMode: ReadWriteOnce
        storageClass: zfs-nfs
      music:
        enabled: true
        type: hostPath
        hostPath: /mnt/media
        hostPathType: Directory

    service:
      main:
        ports:
          http:
            port: 4533

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi

    nodeSelector:
      kubernetes.io/hostname: akasha
