---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: grafana-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: secret/grafana
        property: admin_user
    - secretKey: admin-password
      remoteRef:
        key: secret/grafana
        property: admin_password
---
# Grafana OIDC credentials for Authentik integration
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: grafana-oidc-credentials
    creationPolicy: Owner
  data:
    - secretKey: GRAFANA_OIDC_CLIENT_SECRET
      remoteRef:
        key: secret/authentik
        property: grafana_client_secret
