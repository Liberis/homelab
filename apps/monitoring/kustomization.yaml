---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
  - externalsecret.yaml
  - kube-prometheus-stack.yaml
  - loki.yaml
  - ingress.yaml
configMapGenerator:
  - name: mktxp-dashboard
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
    files:
      - dashboards/mktxp.json
