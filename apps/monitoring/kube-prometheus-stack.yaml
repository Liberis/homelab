---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "72.*"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  values:
    # Alertmanager
    alertmanager:
      enabled: true
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: zfs-nfs
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 5Gi

    # Grafana
    grafana:
      enabled: true
      admin:
        existingSecret: grafana-credentials
        userKey: admin-user
        passwordKey: admin-password
      deploymentStrategy:
        type: Recreate
      persistence:
        enabled: true
        storageClassName: zfs-nfs
        size: 10Gi
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki:3100
          access: proxy
          isDefault: false
          jsonData:
            maxLines: 1000
      service:
        type: ClusterIP
      grafana.ini:
        server:
          root_url: https://grafana.liberispat.com

    # Prometheus
    prometheus:
      prometheusSpec:
        retention: 30d
        retentionSize: "45GB"
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: zfs-nfs
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
        # Resource limits appropriate for homelab
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        # Scrape all namespaces
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false

    # Node exporter for host metrics
    nodeExporter:
      enabled: true

    # Kube state metrics
    kubeStateMetrics:
      enabled: true

    # Disable components not needed for k3s
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
