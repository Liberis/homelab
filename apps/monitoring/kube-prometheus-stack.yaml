---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  timeout: 15m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "72.*"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  values:
    # Alertmanager
    alertmanager:
      enabled: true
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: zfs-nfs
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 5Gi

    # Grafana
    grafana:
      enabled: true
      admin:
        existingSecret: grafana-credentials
        userKey: admin-user
        passwordKey: admin-password
      deploymentStrategy:
        type: Recreate
      persistence:
        enabled: true
        storageClassName: zfs-nfs
        size: 10Gi
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki:3100
          access: proxy
          isDefault: false
          jsonData:
            maxLines: 1000
      service:
        type: ClusterIP
      envFromSecrets:
        - name: grafana-oidc-credentials
      grafana.ini:
        server:
          root_url: https://grafana.liberispat.com
        auth.generic_oauth:
          enabled: true
          name: Authentik
          allow_sign_up: true
          client_id: grafana
          client_secret: ${GRAFANA_OIDC_CLIENT_SECRET}
          scopes: openid profile email groups
          auth_url: https://auth.liberispat.com/application/o/authorize/
          token_url: https://auth.liberispat.com/application/o/token/
          api_url: https://auth.liberispat.com/application/o/userinfo/
          role_attribute_path: contains(groups[*], 'admins') && 'Admin' || 'Viewer'

    # Prometheus
    prometheus:
      prometheusSpec:
        retention: 30d
        retentionSize: "45GB"
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: zfs-nfs
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
        # Resource limits appropriate for homelab
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        # Scrape all namespaces
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false

    # Node exporter for host metrics
    nodeExporter:
      enabled: true

    # Kube state metrics
    kubeStateMetrics:
      enabled: true

    # Disable components not needed for k3s
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
