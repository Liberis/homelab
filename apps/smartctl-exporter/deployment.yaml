---
# External Endpoints for host-based smartctl-exporter
# The exporter runs on the host (outside Kubernetes) and exposes metrics
# Prometheus scrapes this endpoint via the Service/Endpoints defined here
apiVersion: v1
kind: Service
metadata:
  name: smartctl-exporter
  namespace: smartctl-exporter
  labels:
    app: smartctl-exporter
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 9633
      targetPort: 9633
      name: metrics
---
apiVersion: v1
kind: Endpoints
metadata:
  name: smartctl-exporter
  namespace: smartctl-exporter
  labels:
    app: smartctl-exporter
subsets:
  - addresses:
      # Host IP where smartctl-exporter runs (akasha)
      - ip: 192.168.10.12
    ports:
      - port: 9633
        name: metrics
