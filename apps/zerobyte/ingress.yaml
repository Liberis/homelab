---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zerobyte
  namespace: zerobyte
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik-forward-auth@kubernetescrd
spec:
  tls:
    - hosts:
        - zerobyte.liberispat.com
      secretName: liberispat-wildcard-tls
  rules:
    - host: zerobyte.liberispat.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zerobyte
                port:
                  number: 4096
