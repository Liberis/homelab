---
# External Endpoints for host-based zfs_exporter
# The exporter runs on the host (outside Kubernetes) and exposes metrics
# Prometheus scrapes this endpoint via the Service/Endpoints defined here
apiVersion: v1
kind: Service
metadata:
  name: zfs-exporter
  namespace: zfs-exporter
  labels:
    app: zfs-exporter
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 9134
      targetPort: 9134
      name: metrics
---
apiVersion: v1
kind: Endpoints
metadata:
  name: zfs-exporter
  namespace: zfs-exporter
  labels:
    app: zfs-exporter
subsets:
  - addresses:
      # Host IP where zfs_exporter runs (jarvis)
      - ip: 192.168.10.11
    ports:
      - port: 9134
        name: metrics
