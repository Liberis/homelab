---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zfs-exporter
  namespace: zfs-exporter
  labels:
    app: zfs-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zfs-exporter
  template:
    metadata:
      labels:
        app: zfs-exporter
    spec:
      containers:
        - name: zfs-exporter
          image: ghcr.io/pdf/zfs_exporter:v2.3.6
          args:
            - "--web.listen-address=:9134"
            - "--web.telemetry-path=/metrics"
          ports:
            - containerPort: 9134
              name: metrics
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            privileged: true
          volumeMounts:
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: proc
              mountPath: /proc
              readOnly: true
            - name: dev
              mountPath: /dev
              readOnly: true
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: sys
          hostPath:
            path: /sys
        - name: proc
          hostPath:
            path: /proc
        - name: dev
          hostPath:
            path: /dev
      nodeSelector:
        kubernetes.io/hostname: jarvis
      hostNetwork: false
      hostPID: true
---
apiVersion: v1
kind: Service
metadata:
  name: zfs-exporter
  namespace: zfs-exporter
  labels:
    app: zfs-exporter
spec:
  selector:
    app: zfs-exporter
  ports:
    - port: 9134
      targetPort: metrics
      name: metrics
