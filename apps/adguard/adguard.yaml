---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: gabe565
  namespace: adguard
spec:
  interval: 24h
  url: https://charts.gabe565.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adguard-home
  namespace: adguard
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: adguard-home
      version: "0.*"
      sourceRef:
        kind: HelmRepository
        name: gabe565
        namespace: adguard
  valuesFrom:
    - kind: Secret
      name: adguard-config
      valuesKey: config
      targetPath: config
  values:
    # DNS services - LoadBalancer with dedicated IP
    service:
      dns-tcp:
        enabled: true
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          metallb.universe.tf/loadBalancerIPs: "192.168.10.254"
          metallb.universe.tf/allow-shared-ip: adguard-dns
        ports:
          dns-tcp:
            enabled: true
            port: 53
            protocol: TCP
            targetPort: 53
          dns-over-tls:
            enabled: false

      dns-udp:
        enabled: true
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          metallb.universe.tf/loadBalancerIPs: "192.168.10.254"
          metallb.universe.tf/allow-shared-ip: adguard-dns
        ports:
          dns-udp:
            enabled: true
            port: 53
            protocol: UDP
            targetPort: 53
          dns-over-quic:
            enabled: false

      # Main web UI service (accessed via Traefik Ingress)
      main:
        ports:
          http:
            port: 3000

    # Persistence for config and data
    persistence:
      config:
        enabled: true
        storageClass: local-path
        size: 1Gi
        accessMode: ReadWriteOnce
      data:
        enabled: true
        storageClass: local-path
        size: 2Gi
        accessMode: ReadWriteOnce

    # Resources
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 1G

    # Run on control plane with ZFS
    nodeSelector:
      kubernetes.io/hostname: mainframe

    # AdGuard Home configuration is injected via valuesFrom (ExternalSecret)
