---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: harbor
  namespace: harbor
spec:
  interval: 24h
  url: https://helm.goharbor.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  interval: 30m
  timeout: 15m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: harbor
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: harbor
  values:
    expose:
      type: ingress
      tls:
        enabled: true
        certSource: auto
      ingress:
        hosts:
          core: registry.liberispat.com
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"

    externalURL: https://registry.liberispat.com

    harborAdminPassword: ""
    existingSecretAdminPassword: harbor-credentials
    existingSecretAdminPasswordKey: admin_password

    existingSecretSecretKey: harbor-credentials

    persistence:
      enabled: true
      persistentVolumeClaim:
        registry:
          storageClass: zfs-nfs
          size: 50Gi
        jobservice:
          storageClass: zfs-nfs
          size: 1Gi
        database:
          storageClass: zfs-nfs-db
          size: 5Gi
        redis:
          storageClass: zfs-nfs
          size: 1Gi
        trivy:
          storageClass: zfs-nfs
          size: 5Gi

    database:
      type: internal
      internal:
        nodeSelector:
          kubernetes.io/hostname: akasha

    redis:
      type: internal
      internal:
        nodeSelector:
          kubernetes.io/hostname: akasha

    trivy:
      enabled: true
      nodeSelector:
        kubernetes.io/hostname: akasha

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

    portal:
      nodeSelector:
        kubernetes.io/hostname: akasha
    core:
      nodeSelector:
        kubernetes.io/hostname: akasha
      # OIDC Configuration (Authentik)
      configOverwriteJson: |
        {
          "auth_mode": "oidc_auth",
          "oidc_name": "Authentik",
          "oidc_endpoint": "https://auth.liberispat.com/application/o/harbor/",
          "oidc_client_id": "harbor",
          "oidc_groups_claim": "groups",
          "oidc_admin_group": "admins",
          "oidc_scope": "openid,profile,email",
          "oidc_user_claim": "preferred_username",
          "oidc_verify_cert": true,
          "oidc_auto_onboard": true
        }
      # OIDC client secret injected via environment variable
      extraEnvVars:
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: harbor-oidc-credentials
              key: OIDC_CLIENT_SECRET
    jobservice:
      nodeSelector:
        kubernetes.io/hostname: akasha
    registry:
      nodeSelector:
        kubernetes.io/hostname: akasha
