---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-credentials
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: harbor-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin_password
      remoteRef:
        key: secret/harbor
        property: admin_password
    - secretKey: secretKey
      remoteRef:
        key: secret/harbor
        property: secret_key
