---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bjw-s
  namespace: anytype
spec:
  interval: 24h
  url: https://bjw-s-labs.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: anytype
  namespace: anytype
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: app-template
      version: "3.*"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: anytype
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/grishy/any-sync-bundle
              tag: latest
            env:
              TZ: "Europe/London"
              ANY_SYNC_BUNDLE_INIT_EXTERNAL_ADDRS: "anytype.liberispat.com"
            probes:
              liveness:
                enabled: true
                spec:
                  tcpSocket:
                    port: 33010
                  initialDelaySeconds: 30
                  periodSeconds: 30
              readiness:
                enabled: true
                spec:
                  tcpSocket:
                    port: 33010
                  initialDelaySeconds: 10
                  periodSeconds: 10
              startup:
                enabled: true
                spec:
                  tcpSocket:
                    port: 33010
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi

    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: jarvis

    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          drpc:
            port: 33010
            protocol: TCP
          quic:
            port: 33020
            protocol: UDP

    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: zfs-nfs
        globalMounts:
          - path: /data
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: anytype-drpc
  namespace: anytype
spec:
  entryPoints:
    - anytype-drpc
  routes:
    - match: HostSNI(`*`)
      services:
        - name: anytype
          port: 33010
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteUDP
metadata:
  name: anytype-quic
  namespace: anytype
spec:
  entryPoints:
    - anytype-quic
  routes:
    - services:
        - name: anytype
          port: 33020
