---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bjw-s
  namespace: slskd
spec:
  interval: 24h
  url: https://bjw-s-labs.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: slskd
  namespace: slskd
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: app-template
      version: "3.*"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: slskd
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: slskd/slskd
              tag: latest
            env:
              TZ: "Europe/London"
              SLSKD_REMOTE_CONFIGURATION: "true"
            probes:
              liveness:
                enabled: true
                spec:
                  httpGet:
                    path: /
                    port: 5030
              readiness:
                enabled: true
                spec:
                  httpGet:
                    path: /
                    port: 5030
              startup:
                enabled: true
                spec:
                  httpGet:
                    path: /
                    port: 5030
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                cpu: 1000m
                memory: 512Mi

    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: akasha

    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 5030

    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: zfs-nfs
        globalMounts:
          - path: /app
      downloads:
        enabled: true
        type: hostPath
        hostPath: /mnt/media/downloads
        globalMounts:
          - path: /downloads
      media:
        enabled: true
        type: hostPath
        hostPath: /mnt/media
        globalMounts:
          - path: /media
