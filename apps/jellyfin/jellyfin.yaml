---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 24h
  url: https://jellyfin.github.io/jellyfin-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: jellyfin
      version: "2.7.0"
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: jellyfin
  values:
    persistence:
      config:
        enabled: true
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: zfs-nfs
      media:
        enabled: true
        type: hostPath
        hostPath: /mnt/media

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 2Gi

    nodeSelector:
      kubernetes.io/hostname: akasha
