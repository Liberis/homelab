---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: rubxkube
  namespace: audiobookshelf
spec:
  interval: 24h
  url: https://rubxkube.github.io/charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: audiobookshelf
      version: "0.0.2"
      sourceRef:
        kind: HelmRepository
        name: rubxkube
        namespace: audiobookshelf
  values:
    common:
      variables:
        nonSecret:
          TZ: "UTC"

      persistence:
        enabled: true
        volumes:
          - name: "audiobooks"
            storageClassName: "zfs-nfs"
            size: "50Gi"
            containerMount: "/audiobooks/"
          - name: "podcasts"
            storageClassName: "zfs-nfs"
            size: "10Gi"
            containerMount: "/podcasts/"
          - name: "ebooks"
            storageClassName: "zfs-nfs"
            size: "20Gi"
            containerMount: "/ebooks/"
          - name: "metadata"
            storageClassName: "zfs-nfs"
            size: "5Gi"
            containerMount: "/metadata/"

      deployment:
        memoryRequest: 128Mi
        cpuRequest: 100m
        memoryLimit: 512Mi

    # Run on control plane with ZFS
    nodeSelector:
      kubernetes.io/hostname: akasha
