---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: democratic-csi
  namespace: democratic-csi
spec:
  interval: 24h
  url: https://democratic-csi.github.io/charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democratic-csi-nfs
  namespace: democratic-csi
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: democratic-csi
      version: "0.*"
      sourceRef:
        kind: HelmRepository
        name: democratic-csi
        namespace: democratic-csi
  values:
    csiDriver:
      name: "org.democratic-csi.nfs"

    storageClasses:
      - name: zfs-nfs
        defaultClass: true
        reclaimPolicy: Delete
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          fsType: nfs
        mountOptions:
          - nfsvers=4.1
          - noatime
          - nodiratime
          - async
          - rsize=1048576
          - wsize=1048576
        secrets:
          provisioner-secret:
          controller-publish-secret:
          node-stage-secret:
          node-publish-secret:
          controller-expand-secret:

      - name: zfs-nfs-db
        defaultClass: false
        reclaimPolicy: Delete
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          fsType: nfs
        mountOptions:
          - nfsvers=4.1
          - noatime
          - nodiratime
          - sync
        secrets:
          provisioner-secret:
          controller-publish-secret:
          node-stage-secret:
          node-publish-secret:
          controller-expand-secret:

    volumeSnapshotClasses:
      - name: zfs-nfs-snapshots
        parameters:
          detachedSnapshots: "true"
        secrets:
          snapshotter-secret:

    driver:
      existingConfigSecret: democratic-csi-driver-config
      config:
        driver: zfs-generic-nfs

    controller:
      enabled: true
      strategy: deployment
      externalSnapshotter:
        enabled: true

    node:
      enabled: true
      hostPID: true
      driver:
        extraEnv:
          - name: ISCSIADM_HOST_STRATEGY
            value: nsenter
          - name: ISCSIADM_HOST_PATH
            value: /usr/local/sbin/iscsiadm
