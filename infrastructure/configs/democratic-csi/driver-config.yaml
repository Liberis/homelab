---
apiVersion: v1
kind: Secret
metadata:
  name: democratic-csi-driver-config
  namespace: democratic-csi
stringData:
  driver-config-file.yaml: |
    driver: zfs-generic-nfs

    zfs:
      datasetParentName: tank/k8s/volumes
      detachedSnapshotsDatasetParentName: tank/k8s/snapshots
      datasetEnableQuotas: true
      datasetEnableReservation: false
      datasetPermissionsMode: "0777"
      datasetPermissionsUser: 0
      datasetPermissionsGroup: 0
      datasetProperties:
        "org.democratic-csi:pvc_name": "{{ parameters.[csi.storage.k8s.io/pvc/name] }}"
        "org.democratic-csi:pvc_namespace": "{{ parameters.[csi.storage.k8s.io/pvc/namespace] }}"

    nfs:
      shareStrategy: setDatasetProperties
      shareStrategySetDatasetProperties:
        properties:
          sharenfs: "rw,no_subtree_check,no_root_squash"
      shareHost: 192.168.10.12
