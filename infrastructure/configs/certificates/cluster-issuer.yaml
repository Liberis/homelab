apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
# CA Certificate - this will be the root CA for your local domain
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zion-local-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: zion-local-ca
  secretName: zion-local-ca-secret
  duration: 87600h # 10 years
  renewBefore: 8760h # 1 year
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
# ClusterIssuer that uses the CA to issue certificates
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: zion-local-ca-issuer
spec:
  ca:
    secretName: zion-local-ca-secret
