apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zion-local-wildcard
  namespace: kube-system
spec:
  secretName: zion-local-wildcard-tls
  duration: 8760h # 1 year
  renewBefore: 720h # 30 days
  commonName: "*.zion.local"
  dnsNames:
    - "*.zion.local"
    - "zion.local"
  issuerRef:
    name: zion-local-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
