---
# IPAddressPool defines which IPs MetalLB can assign to LoadBalancer services
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default-pool
  namespace: metallb-system
spec:
  addresses:
    # Traefik mainframe - HTTP/HTTPS
    - 192.168.10.101/32
    # Traefik akasha - HTTP/HTTPS, SMB, GitLab SSH
    - 192.168.10.102/32
    # AdGuard DNS - dedicated IP for DNS service
    - 192.168.10.254/32
---
# L2Advertisement tells MetalLB to use Layer 2 (ARP) to announce IPs
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default
  namespace: metallb-system
spec:
  ipAddressPools:
    - default-pool
