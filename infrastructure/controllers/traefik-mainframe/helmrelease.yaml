---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik-mainframe
spec:
  interval: 24h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik-mainframe
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: traefik
      version: "39.*"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik-mainframe
  values:
    # Single replica for homelab
    deployment:
      replicas: 1

    # Run on mainframe node
    nodeSelector:
      kubernetes.io/hostname: mainframe

    # Global settings (v39+ structure)
    global:
      sendAnonymousUsage: false

    # IngressClass configuration
    ingressClass:
      name: traefik-mainframe
      isDefaultClass: false

    # Entrypoints configuration
    ports:
      # HTTP - redirects to HTTPS
      web:
        port: 8000
        expose:
          default: true
        exposedPort: 80
        protocol: TCP
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true

      # HTTPS
      websecure:
        port: 8443
        expose:
          default: true
        exposedPort: 443
        protocol: TCP
        http:
          tls:
            enabled: true

    # Service configuration - LoadBalancer with dedicated IP
    service:
      enabled: true
      type: LoadBalancer
      spec:
        loadBalancerIP: 192.168.10.101
        externalTrafficPolicy: Local

    # TLS store for default certificate
    tlsStore:
      default:
        defaultCertificate:
          secretName: liberispat-wildcard-tls

    # Enable Kubernetes Ingress provider
    providers:
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: true
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true

    # Logs
    logs:
      general:
        level: INFO
      access:
        enabled: true

    # Resources
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
