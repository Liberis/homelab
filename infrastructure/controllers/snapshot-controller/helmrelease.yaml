---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: piraeus-charts
  namespace: snapshot-controller
spec:
  interval: 24h
  url: https://piraeus.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
  namespace: snapshot-controller
spec:
  interval: 30m
  chart:
    spec:
      chart: snapshot-controller
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: piraeus-charts
        namespace: snapshot-controller
  values:
    controller:
      enabled: true
